name: Vaquita Pool Add Rewards

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: GitHub Environment to use for secrets and vars
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      lock_period:
        description: "Lock period passed to add_rewards, in seconds"
        required: true
        type: string
      reward_amount:
        description: "Raw token amount passed to add_rewards, using token decimals"
        required: true
        type: string

permissions:
  contents: read

env:
  STELLAR_CLI_VERSION: "25.1.0"

jobs:
  add-rewards:
    name: Add rewards (${{ inputs.target_environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    concurrency:
      group: vaquita-pool-add-rewards-${{ inputs.target_environment }}
      cancel-in-progress: false
    env:
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      CONTRACT_ID: ${{ vars.VAQUITA_POOL_CONTRACT_ID }}
      STELLAR_RPC_URL: ${{ vars.STELLAR_RPC_URL }}
      STELLAR_NETWORK_PASSPHRASE: ${{ vars.STELLAR_NETWORK_PASSPHRASE }}
      POOL_DEPLOYER_SECRET_KEY: ${{ secrets.POOL_DEPLOYER_SECRET_KEY }}
      LOCK_PERIOD: ${{ inputs.lock_period }}
      REWARD_AMOUNT: ${{ inputs.reward_amount }}
    steps:
      - name: Install Stellar CLI
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) triple=x86_64-unknown-linux-gnu ;;
            aarch64) triple=aarch64-unknown-linux-gnu ;;
            *) echo "unsupported runner architecture: $(uname -m)"; exit 1 ;;
          esac
          ver="${STELLAR_CLI_VERSION}"
          url="https://github.com/stellar/stellar-cli/releases/download/v${ver}/stellar-cli-${ver}-${triple}.tar.gz"
          curl -fsSL "$url" | tar xz
          mkdir -p "${HOME}/.local/bin"
          install -m 755 stellar "${HOME}/.local/bin/stellar"
          rm -f stellar
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          stellar version

      - name: Validate configuration and inputs
        run: |
          set -euo pipefail

          require_env() {
            local name="$1"
            if [ -z "${!name:-}" ]; then
              echo "Missing ${name}. Set it on the '${TARGET_ENVIRONMENT}' GitHub Environment." >&2
              exit 1
            fi
          }

          require_env CONTRACT_ID
          require_env STELLAR_RPC_URL
          require_env STELLAR_NETWORK_PASSPHRASE
          require_env POOL_DEPLOYER_SECRET_KEY

          echo "::add-mask::${POOL_DEPLOYER_SECRET_KEY}"

          if ! printf '%s' "${CONTRACT_ID}" | grep -Eq '^C[A-Z2-7]{55}$'; then
            echo "VAQUITA_POOL_CONTRACT_ID for ${TARGET_ENVIRONMENT} does not look like a Stellar contract id." >&2
            exit 1
          fi

          for value_name in LOCK_PERIOD REWARD_AMOUNT; do
            value="${!value_name}"
            if ! printf '%s' "${value}" | grep -Eq '^[1-9][0-9]*$'; then
              echo "${value_name} must be a positive integer." >&2
              exit 1
            fi
          done

          echo "Environment: ${TARGET_ENVIRONMENT}"
          echo "VaquitaPool contract: ${CONTRACT_ID}"

      - name: Add rewards
        run: |
          set -euo pipefail

          stellar contract invoke \
            --id "${CONTRACT_ID}" \
            --source-account "${POOL_DEPLOYER_SECRET_KEY}" \
            --rpc-url "${STELLAR_RPC_URL}" \
            --network-passphrase "${STELLAR_NETWORK_PASSPHRASE}" \
            -- \
            add_rewards \
            --period "${LOCK_PERIOD}" \
            --reward_amount "${REWARD_AMOUNT}"

      - name: Write step summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## VaquitaPool add rewards"
            echo
            echo "- Environment: ${TARGET_ENVIRONMENT}"
            echo "- Contract: ${CONTRACT_ID}"
            echo "- Lock period: ${LOCK_PERIOD}"
            echo "- Reward amount (raw): ${REWARD_AMOUNT}"
            echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"
