packages:
  - 'apps/api'
  - 'apps/reconciler'
  - 'apps/bridge-worker'
  - 'apps/deployer'
  - 'apps/web'
  - 'apps/admin'
  - 'analytics'
  - 'packages/*'
allowBuilds:
  '@heroui/shared-utils': true
  '@prisma/client': true
  '@prisma/engines': true
  '@reown/appkit': true
  '@stellar/stellar-sdk': true
  blake-hash: true
  bufferutil: true
  core-js: false
  esbuild: true
  keccak: true
  prisma: true
  protobufjs: true
  secp256k1: true
  sharp: true
  tiny-secp256k1: true
  unrs-resolver: true
  usb: false
  utf-8-validate: true
minimumReleaseAgeExclude:
  - react-dom@19.2.7
  - react@19.2.7
  - '@pollar/core@0.11.3-rc.1'
  - '@pollar/react@0.11.3-rc.1'
