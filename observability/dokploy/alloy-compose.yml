# Vaquita — dev Grafana Alloy collector, deployed as a Dokploy Compose service.
# Managed in-repo per docs/grafana-cloud-observability-prd.md (issue 036).
#
# Set the GRAFANA_CLOUD_* values as environment variables on THIS Dokploy
# service (sourced from host secrets — never committed). Only the three
# PROMETHEUS_* are used in dev (metrics only); the LOKI_* are added for
# staging/prod in issue 038.

services:
  alloy:
    # Pin an exact tag — never latest/canary in production. Verify the current
    # stable at https://github.com/grafana/alloy/releases before bumping.
    image: grafana/alloy:v1.17.0
    container_name: vaquita-alloy-dev
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    environment:
      GRAFANA_CLOUD_PROMETHEUS_REMOTE_WRITE_URL: ${GRAFANA_CLOUD_PROMETHEUS_REMOTE_WRITE_URL}
      GRAFANA_CLOUD_PROMETHEUS_USERNAME: ${GRAFANA_CLOUD_PROMETHEUS_USERNAME}
      GRAFANA_CLOUD_PROMETHEUS_API_KEY: ${GRAFANA_CLOUD_PROMETHEUS_API_KEY}
    volumes:
      # Alloy config (repo-owned), relative to this compose file.
      - ../alloy/dev.alloy:/etc/alloy/config.alloy:ro
      # Docker socket for container discovery + cAdvisor (trusted infra).
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Host filesystem for node metrics.
      - /:/rootfs:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Alloy WAL / state.
      - alloy-data:/var/lib/alloy/data
    networks:
      - dokploy-network

volumes:
  alloy-data:

networks:
  # Join the existing Dokploy network so Alloy can reach api-service privately.
  # TODO: confirm the network name Dokploy uses for the Vaquita project
  # (commonly `dokploy-network`).
  dokploy-network:
    external: true
